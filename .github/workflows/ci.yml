name: CI

on:
  push:
    # Documents do not change what is built. A tag still runs: it can be a release.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  # Run from the Actions page: the macOS build and the real-app check. With dry_run, the
  # release job builds what a release would hold and keeps it as an artifact.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the release files without making a release"
        type: boolean
        default: false
  # The real agents, weekly: their versions are pinned, but what the claim rests on
  # should be rechecked without waiting for a change here (HRN-007).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Two jobs, for what minutes cost on a private repository, where a macOS minute counts
# ten: the tests on Linux for every push, and the macOS build, lint and real-app check
# on tags, weekly and from the Actions page (docs/ROADMAP.md, "From here to 0.1.0").
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies match their checksums
        run: make verify-deps

      # Commands run through the login shell, zsh by default, as on a Mac.
      - name: zsh
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Formatted and vetted
        run: |
          test -z "$(gofmt -l cmd internal frontend/embed.go)" || { gofmt -l cmd internal frontend/embed.go; exit 1; }
          go vet ./internal/...

      # macOS-only tests carry a darwin build tag and run in the build job.
      - name: Engine tests, every event checked against the schema
        env:
          FREELOOP_CHECK_EVENTS: ${{ github.workspace }}/schemas/events.json
        run: go test -race ./internal/... ./cmd/freeloop-sbom

      - name: Frontend tests
        run: make frontend-test

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: make tools

      - name: Dependencies match their checksums
        run: make verify-deps

      - name: Engine and frontend tests
        if: github.event_name != 'schedule'
        run: make test

      - name: Build app
        if: github.event_name != 'schedule'
        run: make build

      - name: Lint
        if: github.event_name != 'schedule'
        run: |
          go vet ./cmd/...
          make lint

      # The real interface in a real WebKit view, on scratch data (GUI-030).
      - name: The app works in WebKit
        if: github.event_name != 'schedule'
        run: make check-app

      # What a failed check looked like: a picture of each, the app's log and the results.
      - name: Keep what the app check saw
        if: failure() && github.event_name != 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appcheck
          path: bin/appcheck
          retention-days: 7

      # Each preset's real agent on a stand-in model, a hostile repository included.
      - name: Real agents hold the policy
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        run: make verify-agents

      # Two clean builds are slow, so only for what becomes a release.
      - name: A tag builds reproducibly
        if: startsWith(github.ref, 'refs/tags/')
        run: make verify-repro

  # A tag v<version> makes a draft pre-release from what this commit builds, once every
  # check above has passed. Nothing is published until someone reads the draft and
  # presses Publish. A dry run from the Actions page builds the same files and keeps them
  # as an artifact instead.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: make tools

      # A tag that is not the app's own version would ship a build that names another.
      - name: The tag is the app's version
        run: |
          version=$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/engine/updates.go)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version, the version in internal/engine/updates.go" >&2
            exit 1
          fi
          test -f "docs/release-notes/$version.md" || { echo "docs/release-notes/$version.md is missing" >&2; exit 1; }

      - name: Build the release files
        run: make frontend/node_modules release

      - name: Keep the files of a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.VERSION }}
          path: bin/release
          retention-days: 7

      - name: Make a draft pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag \
            --title "Freeloop $VERSION" --notes-file "docs/release-notes/$VERSION.md" --generate-notes \
            bin/release/*
