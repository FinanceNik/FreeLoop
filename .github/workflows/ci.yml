name: CI

on:
  push:
    # Documents do not change what is built. A tag still runs: it can be a release.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  # Run from the Actions page, for a commit pushed with [skip ci].
  workflow_dispatch:
  # The real agents, weekly: their versions are pinned, but what the claim rests on
  # should be rechecked without waiting for a change here (HRN-007).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: make tools

      - name: Dependencies match their checksums
        run: make verify-deps

      - name: Engine and frontend tests
        if: github.event_name != 'schedule'
        run: make test

      - name: Build app
        if: github.event_name != 'schedule'
        run: make build

      - name: Lint
        if: github.event_name != 'schedule'
        run: |
          go vet ./cmd/...
          make lint

      # The real interface in a real WebKit view, on scratch data (GUI-030).
      - name: The app works in WebKit
        if: github.event_name != 'schedule'
        run: make check-app

      # Each preset's real agent on a stand-in model, a hostile repository included.
      - name: Real agents hold the policy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: make verify-agents

      # Two clean builds are slow, so only for what becomes a release.
      - name: A tag builds reproducibly
        if: startsWith(github.ref, 'refs/tags/')
        run: make verify-repro
