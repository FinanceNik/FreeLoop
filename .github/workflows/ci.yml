name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: make tools

      - name: Engine and frontend tests
        run: make test

      - name: Build app
        run: make build

      - name: Lint
        run: |
          go vet ./cmd/...
          make lint
