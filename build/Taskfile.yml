version: '3'

tasks:
  go:mod:check:
    summary: Fails when go.mod or go.sum need `go mod tidy`; a build never rewrites them (NFR-SEC-004)
    internal: true
    run: once
    cmds:
      - go mod tidy -diff

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      # Its own output, or every build would make the next one stale.
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates TypeScript bindings for the Go services
    run: once
    deps:
      - task: go:mod:check
    sources:
      - "**/*.go"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i {{.MAIN_PKG}}

  generate:icons:
    summary: Generates the macOS `.icns` from the app icon (scripts/make-icon.swift draws it)
    run: once
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
    cmds:
      - ../scripts/make-icon.sh

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
