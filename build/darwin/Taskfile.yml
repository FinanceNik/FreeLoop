version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # OQ-021: macOS 14 is the minimum; keep in sync with LSMinimumSystemVersion.
  MACOS_MIN: "14.0"
  # NFR-XPLAT-001: Apple Silicon only; keep in sync with LSArchitecturePriority.
  MACOS_ARCH: arm64

tasks:
  build:
    summary: Builds the application natively on macOS
    deps:
      - task: common:go:mod:check
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    # Icons are committed under build/darwin; run scripts/make-icon.sh after changing the mark.
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" {{.MAIN_PKG}}
    # SHIPPED=1 (`make dmg`, `make release`, `make package SHIPPED=1`) makes the
    # build users get, which reads no development switch (cmd/freeloop/devenv.go).
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s{{if eq (.SHIPPED | default "") "1"}} -X main.shipped=1{{end}}{{if .COMMIT}} -X github.com/FinanceNik/Freeloop/internal/engine.BuildCommit={{.COMMIT}}{{end}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.MACOS_ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN}}"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  create:app:bundle:
    summary: Creates an ad-hoc signed `.app` bundle
    cmds:
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      # Which commit the bundle is of, readable without starting it (defaults read, make
      # install); before the signature, which covers the file.
      - '{{if .COMMIT}}plutil -replace FreeloopCommit -string "{{.COMMIT}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"{{else}}true{{end}}'
      - test "$(lipo -archs "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}")" = "{{.MACOS_ARCH}}"
      # The speech program voice input runs (GUI-050, `make whisper-cli`), beside the app.
      - test -x "{{.BIN_DIR}}/whisper-cli" || { echo "bin/whisper-cli is missing; make package builds it (make whisper-cli)"; exit 1; }
      - cp "{{.BIN_DIR}}/whisper-cli" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      # The helper first, without the app's entitlements: only the app may open the
      # microphone (build/darwin/entitlements.plist).
      - codesign --force --options runtime --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/whisper-cli"
      - codesign --force --options runtime --entitlements build/darwin/entitlements.plist --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  run:
    summary: Bundles the dev binary as an ad-hoc signed `.app` and runs it
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp build/darwin/Info.dev.plist "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'
