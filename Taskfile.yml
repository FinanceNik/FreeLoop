version: '3'

# Wails v3 build tasks, trimmed from the v3.0.0 react template to macOS only
# (NFR-XPLAT-003 is later). The Makefile is the entry point for humans; these
# tasks are what `wails3 dev` and `wails3 build` call.

vars:
  APP_NAME: "Freeloop"
  BIN_DIR: "bin"
  MAIN_PKG: "./cmd/freeloop"
  PACKAGE_MANAGER: "npm"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
